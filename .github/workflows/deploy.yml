name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production over SSH
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          echo "$PROD_SSH_KEY" > ~/.ssh/prod_key
          chmod 600 ~/.ssh/prod_key
          ssh -i ~/.ssh/prod_key -o StrictHostKeyChecking=accept-new "$PROD_USER@$PROD_HOST" 'bash -se' <<'REMOTE'
          cd /home/ubuntu/nyaitter
          git fetch origin main
          git reset --hard origin/main
          npm install
          npm run migrate
          pm2 restart nyaitter-server --update-env
          REMOTE
